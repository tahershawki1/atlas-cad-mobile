name: Android APK (release)
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select JDK 21
        run: |
          sudo update-alternatives --set java /usr/lib/jvm/temurin-21-jdk-amd64/bin/java || true
          java -version || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atlas-mobile/package-lock.json
      - name: Install and test
        working-directory: atlas-mobile
        run: |
          npm ci
          npm test
          npm run build
      - name: Sync Android
        working-directory: atlas-mobile
        run: npx cap sync android
      - name: Build debug APK
        working-directory: atlas-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish release APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            atlas-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
