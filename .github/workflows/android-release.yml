name: Android APK (release)
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Show Java
        run: java -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atlas-mobile/package-lock.json
      - name: Install and test
        working-directory: atlas-mobile
        run: |
          # Native optional packages (notably sharp/libvips) are downloaded
          # from GitHub during install; retry transient CDN timeouts.
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci --prefer-offline
          npm test
          npm run build
      - name: Sync Android
        working-directory: atlas-mobile
        run: npx cap sync android
      - name: Build signed release APK
        working-directory: atlas-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Resolve release tag
        id: release-tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag_name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            version=$(node -p "require('./atlas-mobile/package.json').version")
            echo "tag_name=v$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: |
            atlas-mobile/android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
