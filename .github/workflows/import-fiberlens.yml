name: Import FiberLens original
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-fiberlens.yml'
permissions:
  contents: write
concurrency:
  group: fiberlens-original-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import pinned upstream as subtree preserving commit history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add fiberlens https://github.com/Ahshika/FiberLens.git
          git fetch fiberlens main
          SOURCE_SHA=29e931062d706820caa4c1a8078723bd9356777c
          git cat-file -e "$SOURCE_SHA^{commit}"
          test ! -e original/FiberLens || { echo "Original already exists; refusing overwrite"; exit 1; }
          git subtree add --prefix=original/FiberLens "$SOURCE_SHA" -m "Import FiberLens original at $SOURCE_SHA (preserve upstream history)"
          git push origin HEAD:main
      - name: Verify imported tree
        shell: bash
        run: |
          set -euo pipefail
          test -f original/FiberLens/package.json
          test -f original/FiberLens/README.md
          git log -1 --format='%H %s'
